# ============================================================================
# Simplif'IA France — Nginx config (hardened security)
# Audit: 2026-05-10 | Pack Security v1
# ============================================================================

# Compression Gzip
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss application/xml image/svg+xml;
gzip_disable "MSIE [1-6]\.";

# Hide nginx version everywhere
server_tokens off;
# more_clear_headers Server;  # désactivé · module nginx-extras non présent dans nginx:alpine

# Rate limiting zones (apply per-location)
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/s;

# Connection limits per IP
limit_conn_zone $binary_remote_addr zone=perip:10m;

# Block common attack patterns at server level
map $http_user_agent $bad_bot {
    default 0;
    ~*(nikto|sqlmap|wpscan|nmap|masscan|dirbuster|gobuster|hydra|metasploit) 1;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Block bad bots
    if ($bad_bot) { return 403; }

    # Block suspicious request methods
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) { return 405; }

    # Block path traversal & common exploits
    location ~* "(\.\./|\.\.\\|/etc/passwd|/proc/|/sys/|<script|javascript:|eval\(|union.*select)" {
        return 403;
    }

    # ========================================================================
    # HEADERS DE SÉCURITÉ
    # ========================================================================

    # Force HTTPS (HSTS) — 1 an, sous-domaines inclus, preload-ready
    # (Note: nécessite HTTPS actif côté reverse proxy/Coolify)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Anti-clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;

    # MIME-sniffing protection
    add_header X-Content-Type-Options "nosniff" always;

    # XSS legacy protection (modern browsers use CSP, mais ne coûte rien)
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer policy — protège la vie privée
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions Policy — désactive les API sensibles par défaut
    add_header Permissions-Policy "accelerometer=(), ambient-light-sensor=(), autoplay=(self), battery=(), camera=(self), display-capture=(), document-domain=(), encrypted-media=(), fullscreen=(self), geolocation=(self), gyroscope=(), magnetometer=(), microphone=(self), midi=(), payment=(self), picture-in-picture=(), publickey-credentials-get=(self), screen-wake-lock=(), sync-xhr=(), usb=(), web-share=(self), xr-spatial-tracking=()" always;

    # Cross-Origin isolation (protection Spectre/Meltdown)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Content-Security-Policy — défense en profondeur contre XSS
    # Inline styles+scripts autorisés pour compat current code (à durcir progressivement avec nonces)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://api.simplif-ia.fr wss://api.simplif-ia.fr https://api.elevenlabs.io https://api-adresse.data.gouv.fr https://recherche-entreprises.api.gouv.fr https://geo.api.gouv.fr; media-src 'self' blob:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;

    # ========================================================================
    # COOKIES (configurer aussi côté backend)
    # ========================================================================
    # Note: Set-Cookie sera émis par le backend avec Secure; HttpOnly; SameSite=Lax

    # ========================================================================
    # CACHE & PERFORMANCE
    # ========================================================================

    # Cache long pour assets statiques (immuables)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, immutable, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        limit_req zone=general burst=50 nodelay;
    }

    # Pas de cache pour HTML (toujours frais)
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        # Reapply security headers (sinon overwrite)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Healthcheck
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # security.txt (RFC 9116)
    location = /.well-known/security.txt {
        return 200 "Contact: mailto:security@simplif-ia.fr\nExpires: 2027-12-31T23:59:59.000Z\nEncryption: https://simplif-ia.fr/.well-known/pgp-key.txt\nAcknowledgments: https://simplif-ia.fr/securite.html\nPolicy: https://simplif-ia.fr/securite.html\nHiring: https://simplif-ia.fr/carrieres.html\nPreferred-Languages: fr, en\nCanonical: https://simplif-ia.fr/.well-known/security.txt\n";
        add_header Content-Type "text/plain; charset=utf-8";
    }

    # robots.txt
    location = /robots.txt {
        return 200 "User-agent: *\nAllow: /\nDisallow: /admin.html\nDisallow: /api/\nSitemap: https://simplif-ia.fr/sitemap.xml\n";
        add_header Content-Type "text/plain";
    }

    # ========================================================================
    # API BACKEND PROXY (rate-limited)
    # ========================================================================

    # Auth endpoints — strict rate limit anti-brute-force
    location ~ ^/api/auth/(login|register|password) {
        limit_req zone=auth burst=3 nodelay;
        limit_conn perip 5;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # API générale
    location /api/ {
        limit_req zone=api burst=30 nodelay;
        limit_conn perip 20;
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 30m;
        # Block admin endpoints from being reached by unauth users
        # (vérification réelle côté FastAPI via JWT)
    }

    # Bloquer /docs et /openapi en production (uniquement dev)
    location /docs {
        # En prod, on retire ces routes côté FastAPI (docs_url=None)
        return 404;
    }
    location /openapi.json {
        return 404;
    }

    # ========================================================================
    # FRONTEND
    # ========================================================================

    location / {
        limit_req zone=general burst=50 nodelay;
        try_files $uri $uri/ /index.html;
    }

    # Cacher les fichiers sensibles
    location ~ /\.(git|env|htaccess|DS_Store) { deny all; return 404; }
    location ~ \.(sql|bak|swp|log|conf)$ { deny all; return 404; }

    # Erreurs
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html { internal; root /usr/share/nginx/html; }

    # Limites de taille de requête (anti-DoS)
    client_body_buffer_size 16K;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 1k;
    client_max_body_size 30m;
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;
}
